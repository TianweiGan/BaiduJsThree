<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <title>自定义POI</title>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="initial-scale=1.0, user-scalable=no">
    <meta http-equiv="X-UA-Compatible" content="IE=Edge">
    <style>
        body,
        html {
          width: 100%;
          height: 100%;
          margin: 0;
        }
        #container {
          height: 100%;
          width: 100%;
        }
        ul li {
        list-style: none;
        }
        .btn-wrap {
            z-index: 999;
            position: fixed;
            bottom: 3.5rem;
            margin-left: 3rem;
            padding: 1rem 1rem;
            border-radius: .25rem;
            background-color: #fff;
            box-shadow: 0 2px 6px 0 rgba(27, 142, 236, 0.5);
        }
        .btn {
            width: 75px;
            height: 30px;
            float: left;
            background-color: #fff;
            color: rgba(27, 142, 236, 1);
            font-size: 14px;
            border:1px solid rgba(27, 142, 236, 1);
            border-radius: 5px;
            margin: 0 5px;
            text-align: center;
            line-height: 30px;
        }
        .btn:hover {
            background-color: rgba(27, 142, 236, 0.8);
            color: #fff;
        }
    </style>
    
    <script src="https://api.map.baidu.com/api?type=webgl&v=1.0&ak=您的AK"></script>

</head>
<body>

    <div id="container"></div>
    <ul class="btn-wrap" style="z-index: 99;">
      <li class = "light btn" onclick = "addLabel()">添加</li>
      <li class = "night btn" onclick = "removeLabels()">清除</li>
    </ul>

</body>
</html>
<script>
    var map = new BMapGL.Map('container');
    // 设置地图样式
    map.setMapStyleV2({     
        styleId: 'e73e64bbe733810a901064332f09c1e9'
    });
    var point = new BMapGL.Point(116.41869196404, 39.901641043953); 
    map.centerAndZoom(point, 14);
    map.enableScrollWheelZoom();
    
    function addLabels() {
        map.addLabelsToMapTile([{
            position: new BMapGL.Point(12957961.232564565 , 4822048.673415739),
            name: '这里有一个公共厕所',
            displayRange: [13, 21],
            textMargin: 8,
            style: {
                fontSize: 30,
                haloSize: 2,
                color: 'rgba(80,92,88,1)',
                strokeColor: '#fff'
            },
            uid: 'fd7e3d0c879487d4c7f025be',
            direction: 3
        }, {
            position: new BMapGL.Point(12957961.232564565 , 4822048.673415739),
            displayRange: [13, 21],
            style: {
                iconSize: [10, 10]
            },
            uid: 'fd7e3d0c879487d4c7f025be',
            direction: 4,
            rank: 60000
        }]);
   }
   // 添加
   function addLabel() {
    addLabels()
    }
    // 清除
    function removeLabels() {
		  map.clearLabels();
	  }
    

</script>
